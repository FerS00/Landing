name: Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Tag v* o SHA de 7 a 40 caracteres hexadecimales para rollback
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build preview
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build
      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=fextracode --branch=pr-${{ github.event.pull_request.number }}
          wranglerVersion: '4.136.3'
      - name: Smoke test preview
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run smoke
      - name: Comment preview URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf 'Preview: %s\n' "$DEPLOYMENT_URL" > preview-comment.md
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file preview-comment.md

  production:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: production
    environment:
      name: production
      url: https://fextracode.com
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Validate rollback reference
        if: github.event_name == 'workflow_dispatch'
        env:
          ROLLBACK_REF: ${{ inputs.ref }}
        run: |
          if [[ "$ROLLBACK_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            exit 0
          fi
          if [[ "$ROLLBACK_REF" == v* ]] && git check-ref-format "refs/tags/$ROLLBACK_REF"; then
            exit 0
          fi
          echo 'ref debe ser un SHA de 7 a 40 caracteres hexadecimales o un tag v* válido.' >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve deployed commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build production site
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build
      - name: Deploy production
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=fextracode --branch=main --commit-hash=${{ env.DEPLOY_SHA }}
          wranglerVersion: '4.136.3'
      - name: Smoke test deployment
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run smoke
      - name: Smoke test production domain
        if: vars.PRODUCTION_URL != ''
        env:
          SMOKE_URL: ${{ vars.PRODUCTION_URL }}
        run: npm run smoke
